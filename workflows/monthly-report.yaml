# Monthly report — what renews the retainer.
#
# The client-facing account of the month: what was spent, what it bought, what
# the loop changed and what happened after, holes declared, next month. Builds
# on everything and ships in the client's language through a publish gate.

id: monthly-report
name: Monthly report
description: "Monthly: the client-facing account of what happened, what changed, and what comes next."
deliverable: 02-monthly-report.md
recurring: monthly
builds_on: [media-plan, growth-audit, website-audit, optimization-loop]

phases:
  - id: compile
    agent: analyst
    produces: 01-compilation.md
    requires: []
    task: |
      Assemble the month's facts. This is internal — completeness over polish.

      1. Spend and results by channel for the month, from connected tools (commands
         and real output pasted) or declared as holes with what would fill them.
      2. What the optimization loop changed this month (its runs are injected above):
         list each approved movement and what happened after it — did the expected
         impact materialize? Be honest when it did not.
      3. Deliverables shipped this month, one line each.
      4. The three most important deltas vs last month, with origins.
      5. Open holes, carried forward explicitly.

      Also: end the file with a ```metrics fence (house rule 1b) carrying the month's
      measured KPIs, one CSV line each (metric,channel,period,value,unit) — only
      numbers that appear above with their origin. No fence if nothing was measurable.
  - id: report
    agent: strategist
    produces: 02-monthly-report.md
    requires: [01-compilation.md]
    gate_class: publish
    gate: |
      The client reads this. Is it in their language? Does every number carry its
      origin? Are the misses reported as plainly as the wins? Approving releases it
      to the client's portal view.
    task: |
      Write the month for the client. One page of narrative, then the detail.

      Structure:
      1. **The month in three sentences.** What moved, what we changed, what's next.
      2. **What was spent and what it bought** — by channel, vs plan where one exists.
      3. **What we changed and why** — the loop's approved movements, each with its
         outcome so far. Report the ones that did not work exactly as plainly as the
         ones that did: the client is paying for judgement, and judgement includes
         being wrong out loud.
      4. **What we could not measure** — the holes, and what access would close each.
      5. **Next month** — the plan, concrete.

      In the client's language. No agency jargon. The test: a client who reads only
      this page every month should never be surprised by their own account.
